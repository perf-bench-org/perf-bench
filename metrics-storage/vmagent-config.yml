# Интервал 5 с, а не 10 с. От него напрямую зависит цифра в отчёте и размер штрафа: максимум
# очереди и максимум утилизации KV-кэша — это gauge'и, и в отчёт попадает максимум СРЕДИ СНЯТЫХ
# значений. Всплеск короче интервала скрейпа в данных физически не существует, а штраф за очередь
# доходит до -15 баллов. Величины, считающиеся из гистограмм и счётчиков (TTFT, TPOT, ITL,
# throughput), накопительные и от интервала почти не зависят.
#
# Значение продублировано константой Report.SCRAPE_INTERVAL_SEC — оно печатается в отчёте рядом
# с величинами, которые им ограничены. Меняя здесь, поменяйте и там.
#
# %{VLLM_HOST} и %{VLLM_PORT} разворачивает сам vmagent из переменных окружения; они приходят из
# корневого .env через env_file в docker-compose.yml. Адрес здесь не пишется буквально намеренно:
# тест берёт его оттуда же, и разойтись с ним больше нельзя.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vllm
    scrape_interval: 5s
    static_configs:
      - targets: ["%{VLLM_HOST}:%{VLLM_PORT}"]
