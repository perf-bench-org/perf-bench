# --- target ---
target.url=http://vllm:8000/v1/chat/completions
vllm.baseUrl=http://vllm:8000
target.apiKey=

# --- metrics backend ---
vm.url=http://victoria-metrics:8428
# Пауза после конца окна удержания перед запросами к хранилищу. VictoriaMetrics по умолчанию
# не отдаёт данные за последние 30 с (-search.latencyOffset), vmagent досылает последний скрейп
# не мгновенно. Без паузы хвост окна окажется пустым, и отчёт получится по неполным данным.
vm.settleSec=35

# --- load mode: step | flat | report ---
mode=flat

step.profile=100 300 300; 120 300 300; 140 300 300; 160 300 300; 180 300 300; 200 300 300

flat.rpm=180
flat.ramp=300
flat.hold=1800

# --- dataset ---
dataset.path=/data/prompts.csv
dataset.delimiter=,
dataset.seed=42

# --- engine ---
request.connectTimeoutSec=10
# Должен быть не меньше Threads.ITERATION_SEC (300 с): запрос, оборванный по таймауту, попадает
# в статистику как ошибка и рушит одновременно error rate и фактический RPM.
request.responseTimeoutSec=600

# --- scoring ---
# Порог штрафа за время отклика. НЕ путать с Threads.ITERATION_SEC (300 с) — та константа задаёт
# ожидаемую длительность запроса и используется для расчёта числа потоков. Здесь — граница
# допустимого, задаётся с запасом над ожидаемой.
#
# Сверху величина ограничена тактом потока (число потоков x 60 / RPM = ITERATION_SEC x SAFETY =
# 375 с): ответ медленнее такта уже делает целевой RPM недостижимым. Порог выше такта создаёт
# зону, где ответ формально в SLA, а RPM недобирается — стенд предупредит об этом при старте.
scoring.e2eSlaSec=360

# --- run ---
run.id=
run.resultsDir=/results
